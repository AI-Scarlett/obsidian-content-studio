<!doctype html><html><head><title>Nested article styles</title><style>#js_content p{margin:0} #js_content{font-family:'PingFang SC',sans-serif;font-size:16px}</style></head><body>
<div id="js_content">
  <section style="background:#fff9ed;padding:12px;border:1px solid #125ba3">
    <section style="background-color:#125ba3;padding:10px 14px;border-radius:6px">
      <p style="margin:0;text-align:center"><span style="color:#ffffff;font-size:22px"><strong>一个内层文字标题</strong></span></p>
    </section>
    <p style="line-height:1.75;text-align:justify;text-indent:2em"><span style="font-family:'PingFang SC',sans-serif;font-size:17px;letter-spacing:1px;color:#181818">正文以真实文字节点为准。这里使用与公众号编辑器相同的段落、内层文字和强调结构，确保文章主要字体不会被较小的附注抢走。<strong style="color:#125ba3">这里强调一个重点。</strong></span></p>
    <p style="line-height:1.75"><br></p>
    <p style="line-height:1.75;text-align:justify;text-indent:2em"><span style="font-family:'PingFang SC',sans-serif;font-size:17px;letter-spacing:1px;color:#181818">第二段保留相同的字间距、颜色、首行缩进与字体，用足够的正文检查采样权重。外层背景和内边距属于整篇文章，不能错套成单段底色。</span></p>
    <p style="line-height:1.75"><br></p>
    <blockquote style="background:#edf3fc;border-left:3px solid #125ba3;padding:12px 16px"><p><span style="font-size:16px;color:#36577d">引用区域的样式独立于普通正文。</span></p></blockquote>
    <p style="font-size:12px;color:#999999;letter-spacing:2px;margin:0 15px">较小的附注。</p>
  </section>
</div></body></html>
