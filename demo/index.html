<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨稿 Content Studio · 本地预览</title><link rel="stylesheet" href="/styles.css"><style>html,body,#demo-pane,#app{margin:0;width:100%;height:100%;}body{background:#f7f8f3;}#demo-picker{border:1px solid #d4dfc7;border-radius:10px;padding:24px;background:#fbfcf5;color:#526148;max-width:460px;}#demo-picker::backdrop{background:#24321e60}#demo-picker button{display:block;width:100%;padding:12px;margin:10px 0;background:#eef3e6;border:1px solid #d6e2c8;border-radius:5px;cursor:pointer;color:#49613a}</style></head><body><aside id="layout-tools" hidden style="padding:8px 16px;background:#e8edde;height:44px;box-sizing:border-box"><label>模拟 Obsidian 分栏宽度 <select id="pane-width"><option value="680">680 px</option><option value="960">960 px</option><option value="500">500 px</option><option value="360">360 px</option><option value="1200">1200 px</option></select></label></aside><div id="demo-pane" class="mg-view"><div id="app"></div></div><script>if(location.hash==='#layout-check'){document.getElementById('layout-tools').hidden=false;const pane=document.getElementById('demo-pane');const select=document.getElementById('pane-width');pane.style.height='calc(100% - 44px)';pane.style.maxWidth='100%';const resize=()=>pane.style.width=select.value+'px';select.addEventListener('change',resize);resize();}</script><script type="module" src="/app.js"></script></body></html>
