<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨稿 · 发布进度</title><link rel="stylesheet" href="importer.css"></head>
<body><main>
<header><span class="mark">墨</span><div><h1>发布到平台</h1><p>Content Studio · 浏览器发布助手 <span id="version"></span></p></div></header>
<p id="intro">正在接收墨稿稿件…</p>
<section><h2 id="article">准备发布</h2><p id="target"></p><p id="status" role="status" aria-live="polite">正在连接…</p></section>
<p id="guide">如果平台要求登录，请在新打开的页面登录；登录后会自动继续同步。同步期间请保持此页和平台页打开。</p>
<div class="actions"><button id="show" disabled>查看平台页面</button><button id="cancel" class="secondary" disabled>停止同步</button></div>
<p class="help">完成后，请检查平台草稿与图片，再自行确认发表。</p>
<details><summary>数据与支持范围</summary><p>仅接收这次点击发布的稿件和配图，交给你选择的平台。不会读取其他笔记、剪贴板、Cookie 或密码。没有第三方中转服务器。</p><p>支持公众号图文、小红书长文、知乎专栏和 X 长文的适配测试。平台可能调整样式；如果上传被拒绝或图片核对失败，会停止并保留已同步部分。当前为预览版，真实平台兼容性仍在验证。</p></details>
</main><script src="importer.js"></script></body></html>
