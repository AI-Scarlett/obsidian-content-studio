<header><span class="mark">墨</span><div><h1>回到墨稿</h1><p>在 Obsidian 里继续写作与排版</p></div></header>
<p>正在请求打开 Obsidian 和墨稿工作台。如果浏览器弹出确认，请选择“打开 Obsidian”。</p>
<p>已打开的墨稿会保留正在编辑的内容；首次打开工作台时，会读取 Obsidian 当前笔记。</p>
<div class="actions"><a href="obsidian://content-studio">打开 Obsidian · 墨稿</a></div>
<details><summary>点击后没有打开墨稿？</summary><p>请确认电脑已安装 Obsidian，且上次使用的仓库已启用墨稿 0.1.10 或更新版本。浏览器首次调用可能需要你确认打开应用；取消后可点击上方链接重试。</p><p>有多个仓库时，先在 Obsidian 切换到启用墨稿的仓库。此入口只打开工作台，不导入内容，也不发表稿件。</p></details>
